name: Deploy to Vercel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Vercel Deploy
        uses: amondnet/vercel-action@v20
        with:
          # New input names
          # Preferred/new secret names
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # Legacy input names supported by older action versions — provide them explicitly
          # mapped to the VERCEL_* secrets so older action versions receive the expected inputs.
          zeit-token: ${{ secrets.VERCEL_TOKEN }}
          zeit-org-id: ${{ secrets.VERCEL_ORG_ID }}
          zeit-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
