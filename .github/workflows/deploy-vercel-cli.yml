name: Deploy to Vercel (CLI fallback)

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Vercel CLI — version
        run: npx vercel --version

      - name: Deploy to Vercel (CLI)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # The CLI will use the token from env or --token flag.
          # --prod publishes to production; --confirm skips interactive prompts.
          npx vercel --prod --confirm --token "$VERCEL_TOKEN"
